<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="星灯りの約束 — ティナとロックが星のかけらを取り戻す、Godot製の小さな2D RPG。">
  <meta name="theme-color" content="#0a1720">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    :root {--game-width:min(calc(100vw - 32px),1280px,calc((100svh - 180px) * 16 / 9)); color-scheme:dark; font-family:system-ui,sans-serif; color:#dfe4dc; background:#08131b}
    * {box-sizing:border-box}
    body {margin:0; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 16px; gap:14px; background:radial-gradient(ellipse at 50% 25%,#183436,#08131b 72%)}
    header,footer {width:var(--game-width); display:flex; justify-content:space-between; align-items:center; gap:16px}
    header p {margin:0; font-size:11px; letter-spacing:.19em; color:#b3bda9}
    a {color:#d9c590; text-underline-offset:4px}
    button {font:inherit; font-size:12px; color:#d9c590; background:#12262b; border:1px solid #4e5b4b; padding:8px 12px; cursor:pointer}
    button:hover,button:focus-visible {background:#254443; outline:1px solid #d9c590}
    #game {width:var(--game-width); aspect-ratio:16/9; position:relative; border:1px solid #4b5c51; box-shadow:0 24px 80px #0008; background:#091820}
    #canvas {display:block; width:100%; height:100%; image-rendering:pixelated; outline:none; touch-action:none}
    #game:fullscreen {width:100vw; height:100vh; border:0; display:flex; align-items:center; justify-content:center; background:#08131b}
    #game:fullscreen #canvas {width:min(100vw,177.7778vh); height:min(56.25vw,100vh)}
    #loading {position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#0b1d27}
    #loading[hidden] {display:none}
    #loading .star {font-size:28px; color:#ddc482}
    #loading h1 {font-family:serif; font-weight:500; font-size:clamp(20px,4vw,36px); margin:0; letter-spacing:.12em}
    #status {font-size:12px; margin:0; color:#b2c2ba; max-width:80%; text-align:center; line-height:1.8}
    progress {width:220px; max-width:60%; height:5px; accent-color:#d4bd81}
    footer {align-items:flex-start; font-size:11px; line-height:1.9; color:#9baead}
    footer p {margin:0}
    .links {white-space:nowrap; text-align:right}
    kbd {font:inherit; color:#dce3d8; border:1px solid #354e50; padding:1px 4px}
    noscript {color:#f0c1ad}
    @media(max-width:680px) {body {--game-width:calc(100vw - 12px); padding:10px 6px; justify-content:flex-start} header,footer {padding:0 6px} footer {flex-direction:column; gap:6px} header p {font-size:9px}}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <header><p>A PROMISE IN STARLIGHT · CHAPTER 01</p><button id="fullscreen" type="button">全画面で遊ぶ ↗</button></header>
  <main id="game" aria-label="星灯りの約束">
    <canvas id="canvas" width="640" height="360" tabindex="0" aria-label="RPGのゲーム画面。矢印キーで移動、ZかEnterで決定。">このブラウザはCanvasに対応していません。</canvas>
    <div id="loading" role="status" aria-live="polite"><div class="star">✦</div><h1>星灯りの約束</h1><p id="status">冒険の準備をしています…</p><progress id="progress" aria-label="ゲームの読み込み"></progress></div>
  </main>
  <noscript>遊ぶにはJavaScriptを有効にしてください。</noscript>
  <footer>
    <div><p><kbd>WASD</kbd> / <kbd>矢印</kbd> 移動　 <kbd>Shift</kbd> 走る　 <kbd>Z</kbd> / <kbd>Enter</kbd> 決定　 <kbd>Esc</kbd> 記録帳　 <kbd>M</kbd> 音</p><p>PCのキーボードで遊べます。画面をクリックすると操作と音声が有効になります。セーブはこのブラウザに保存されます。</p></div>
    <p class="links"><a href="https://github.com/lockcole6/starlight-rpg" target="_blank" rel="noopener">GitHub</a> · <a href="CREDITS.txt" target="_blank" rel="noopener">素材クレジット</a></p>
  </footer>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const fail = error => {
      loading.hidden = false;
      progress.hidden = true;
      status.textContent = '読み込めませんでした。Chrome / Edge / Firefoxの最新版で、ページを再読み込みしてください。';
      console.error(error);
    };
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.getElementById('game').requestFullscreen();
        canvas.focus();
      } catch (error) { console.warn('Fullscreen unavailable:', error); }
    });
    canvas.addEventListener('pointerdown', () => canvas.focus());
    const missing = Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
    if (missing.length) fail(new Error(missing.join(', ')));
    else engine.startGame({canvas, onProgress:(current,total) => {
      if (total > 0) {progress.max = total; progress.value = current; status.textContent = '冒険の準備をしています… ' + Math.round(current / total * 100) + '%';}
    }}).then(() => {loading.hidden = true; canvas.focus();}, fail);
  </script>
</body>
</html>
