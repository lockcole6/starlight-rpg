name: Build and deploy Godot to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Fetch Web export templates
        run: python3 tools/fetch_web_dependencies.py
      - name: Import and test
        run: |
          mkdir -p build
          touch build/.gdignore
          Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --import --quit
          Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/run.gd
      - name: Export Web release
        run: |
          mkdir -p build/web
          Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          python3 tools/finalize_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
